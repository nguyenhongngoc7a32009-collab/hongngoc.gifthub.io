<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Của Tôi</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; text-align: center; padding: 50px; background-color: #f4f4f4; }
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        button { background: #007BFF; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 15px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Xin chào! 👋</h1>
        <p>Chào mừng bạn đã ghé thăm trang web nhỏ của tôi. Đây là một giao diện HTML đơn giản được thiết kế nhanh bằng CSS.</p>
        <button onclick="alert('Cảm ơn bạn đã nhấn nút!')">Bấm vào đây</button>
    </div>

</body>
</html>
